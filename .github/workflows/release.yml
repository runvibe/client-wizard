name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nome da versao/tag do release em semver (ex: v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Marcar como pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            build-args: --bundles appimage,deb
            cargo-extra-args: ""
            artifact-name: client-wizard-linux
            artifact-path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sha256
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/deb/*.deb.sha256
          - platform: windows
            os: windows-latest
            build-args: --bundles nsis
            cargo-extra-args: ""
            artifact-name: client-wizard-windows
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sha256
          - platform: macos-aarch64
            os: macos-latest
            build-args: --bundles dmg
            cargo-extra-args: ""
            artifact-name: client-wizard-macos-aarch64
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/dmg/*.dmg.sha256
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sha256
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - platform: macos-x64
            os: macos-latest
            build-args: --target x86_64-apple-darwin --bundles dmg
            cargo-extra-args: --target x86_64-apple-darwin
            artifact-name: client-wizard-macos-x64
            artifact-path: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg.sha256
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sha256
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Intel Rust target
        if: matrix.platform == 'macos-x64'
        run: rustup target add x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Apply release version to bundle metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const releaseVersion = process.env.RELEASE_VERSION.trim();
          const versionMatch = releaseVersion.match(/^v?([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/);

          if (!versionMatch) {
            throw new Error(`Release version must be semver, optionally prefixed with v. Received: ${releaseVersion}`);
          }

          const [, major, minor, patch, prerelease = "", build = ""] = versionMatch;
          const prereleaseIdentifiers = prerelease ? prerelease.slice(1).split(".") : [];
          if (
            prereleaseIdentifiers.some((identifier) =>
              identifier === "" || (/^[0-9]+$/.test(identifier) && identifier.length > 1 && identifier.startsWith("0"))
            )
          ) {
            throw new Error(`Release version has an invalid semver prerelease identifier: ${releaseVersion}`);
          }

          const bundleVersion = [
            String(Number(major)),
            String(Number(minor)),
            String(Number(patch)),
          ].join(".") + prerelease + build;

          for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            json.version = bundleVersion;
            fs.writeFileSync(file, `${JSON.stringify(json, null, 2)}\n`);
          }
          NODE

      - name: Build frontend
        run: npm run build

      - name: Check Rust
        run: cargo check --manifest-path ./src-tauri/Cargo.toml ${{ matrix.cargo-extra-args }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.build-args }}

      - name: Generate artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mapfile -t artifacts < <(
            find src-tauri/target -type f \
              \( -name "*.AppImage" \
                -o -name "*.deb" \
                -o -name "*.exe" \
                -o -name "*.dmg" \
                -o -name "*.app.tar.gz" \) |
              sort
          )

          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No artifacts found to checksum." >&2
            exit 1
          fi

          for artifact in "${artifacts[@]}"; do
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$artifact" | awk '{ print $1 }' > "${artifact}.sha256"
            else
              sha256sum "$artifact" | awk '{ print $1 }' > "${artifact}.sha256"
            fi
          done

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          mapfile -t release_assets < <(find release-assets -type f | sort)
          if [ "${#release_assets[@]}" -eq 0 ]; then
            echo "No release assets found in release-assets/" >&2
            exit 1
          fi

          release_args=(
            "$RELEASE_TAG"
            "${release_assets[@]}"
            --target "${GITHUB_SHA}"
            --title "$RELEASE_TAG"
            --generate-notes
          )

          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "${GITHUB_SHA}" \
              --title "$RELEASE_TAG"

            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              gh release edit "$RELEASE_TAG" --prerelease
            fi

            gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
          else
            gh release create "${release_args[@]}"
          fi
